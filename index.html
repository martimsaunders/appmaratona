<title>Maratona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--ink:#16223A;--muted:#5B6678;--line:#D5DBE4;
  --bib:#F2C230;--run:#2457C5;--long:#0F3A8A;--race:#D7263D;--str:#7A4FB5;
  --climb:#2F8556;--gym:#B26B00;--rest:#8A94A6;--g:#2F8556;--a:#C98A00;--r:#D7263D;
  --nav:#16223A;--navink:#AEB9CD;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524;--surface:#172238;--ink:#E8EDF5;--muted:#9AA6BA;--line:#2A3752;
  --run:#6C97F0;--long:#8FB1FF;--str:#B08BE6;--climb:#5BC38A;--gym:#E0A040;--rest:#7D889C;
  --g:#5BC38A;--a:#E5B23A;--r:#F05468;--nav:#0A101C;
}}
:root[data-theme="dark"]{
  --bg:#0E1524;--surface:#172238;--ink:#E8EDF5;--muted:#9AA6BA;--line:#2A3752;
  --run:#6C97F0;--long:#8FB1FF;--str:#B08BE6;--climb:#5BC38A;--gym:#E0A040;--rest:#7D889C;
  --g:#5BC38A;--a:#E5B23A;--r:#F05468;--nav:#0A101C;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow:hidden;background:var(--nav);-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;height:100%;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px max(16px,calc((100% - 588px) / 2)) 28px}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.1;margin:0}
h2{font-size:1.6rem;margin:28px 0 10px}
h3{font-size:1.25rem}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--bib);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.view{animation:enter .32s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateX(calc(var(--dir,0) * 18px))}to{opacity:1;transform:none}}

/* Dorsal */
.bib{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:0 0 16px;margin-top:4px;overflow:hidden}
.bib-band{background:var(--bib);color:#16223A;font-family:var(--cond);font-weight:700;font-size:1.05rem;padding:8px 40px;text-align:center;border-bottom:2px solid var(--ink)}
.bib-num{font-family:var(--cond);font-weight:800;font-size:clamp(6rem,30vw,9.5rem);line-height:.9;text-align:center;letter-spacing:-.02em;margin-top:14px;font-variant-numeric:tabular-nums}
.bib-cap{text-align:center;font-family:var(--cond);font-size:1.3rem;font-weight:600}
.bib-foot{text-align:center;color:var(--muted);margin-top:6px}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.pin.tl{top:8px;left:10px}.pin.tr{top:8px;right:10px}.pin.bl{bottom:10px;left:10px}.pin.br{bottom:10px;right:10px}

/* Sessões */
.ses{background:var(--surface);border-radius:10px;padding:14px 14px 12px 18px;margin:10px 0;position:relative;border:1px solid var(--line);transition:background-color .35s var(--ease)}
.ses::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:10px 0 0 10px;background:var(--c,var(--rest))}
.t-run{--c:var(--run)}.t-long{--c:var(--long)}.t-race{--c:var(--race)}.t-str{--c:var(--str)}.t-climb{--c:var(--climb)}.t-gym{--c:var(--gym)}.t-rest{--c:var(--rest)}
.ses-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ses h3{color:var(--c);transition:opacity .3s}
.ses ul{margin:8px 0 0;padding-left:18px}
.ses li{margin:4px 0}
.ses.done{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.ses.done h3,.ses.done ul{opacity:.6}
.chk{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--c);background:transparent;border-radius:999px;padding:4px 12px 4px 6px;font-weight:600;font-size:.9rem;color:var(--c);min-height:38px;transition:background-color .25s var(--ease),color .25s var(--ease),transform .12s}
.chk:active{transform:scale(.95)}
.chk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chk path{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .4s var(--ease) .08s}
.chk[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.chk[aria-pressed="true"] path{stroke-dashoffset:0}

/* Smiles */
.feel{margin-top:12px}
.feel-q{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.faces{display:flex;gap:6px}
.fb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 4px 5px;font-size:.82rem;color:var(--muted);transition:background-color .25s var(--ease),border-color .25s,color .25s}
.face{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.face .eye{fill:currentColor;stroke:none}
.fb[data-v="g"]{--f:var(--g)}.fb[data-v="a"]{--f:var(--a)}.fb[data-v="r"]{--f:var(--r)}
.fb[aria-pressed="true"]{color:var(--f);border-color:var(--f);background:color-mix(in srgb,var(--f) 12%,transparent);font-weight:600}
.fb[aria-pressed="true"] .face{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-6deg)}100%{transform:scale(1)}}
.advice{font-size:.9rem;margin-top:8px;padding:9px 11px;border-radius:8px;background:var(--bg)}
.advice:empty{display:none}

/* Exercícios */
.exs{margin-top:10px;display:grid;gap:8px}
.exr{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:8px;border-radius:8px;background:var(--bg)}
.exr b{font-family:var(--cond);font-size:1.12rem;display:block;line-height:1.15}
.exr span{display:block;font-size:.92rem}
.exr em{display:block;font-style:normal;color:var(--muted);font-size:.84rem;margin:1px 0 3px}
.exr small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px}
.figw{display:grid;gap:2px}
.fig{width:100%;height:auto;display:block;overflow:hidden;border-radius:6px;background:var(--surface)}
.fig .lb{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.fig .far{stroke:var(--muted);opacity:.55}
.fig .hd{fill:var(--surface);stroke:var(--ink);stroke-width:3.5}
.fig .pr{fill:color-mix(in srgb,var(--str) 18%,transparent);stroke:color-mix(in srgb,var(--str) 55%,transparent);stroke-width:1.5}
.fig .fl{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.fig .db{fill:var(--str)}
.intro{font-size:.92rem;margin:8px 0 0}

/* Progresso */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.bar{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--run);border-radius:6px;transition:width .9s var(--ease)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div b{font-family:var(--cond);font-size:1.6rem;display:block;line-height:1;font-variant-numeric:tabular-nums}

/* Semanas */
.wk-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;scroll-behavior:smooth}
.wk-strip::-webkit-scrollbar{display:none}
.wk{flex:none;min-width:48px;min-height:48px;border:2px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--cond);font-weight:700;font-size:1.15rem;transition:background-color .2s,color .2s,border-color .2s}
.wk[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.wk.now{box-shadow:inset 0 -4px 0 var(--bib)}
.wk-body{animation:fade .3s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wk-head{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:6px}
.wk-head .km{font-family:var(--cond);font-weight:800;font-size:2.4rem;line-height:1}
.tag{display:inline-block;background:var(--bib);color:#16223A;font-weight:600;font-size:.82rem;border-radius:4px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:6px 0}
.day.today{border:2px solid var(--ink)}
.day-row{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:10px 12px;text-align:left}
.dl{width:50px;flex:none}
.dl b{font-family:var(--cond);font-size:1.25rem;display:block;line-height:1}
.dl span{font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chip{font-size:.85rem;border-radius:5px;padding:2px 8px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:600;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);transition:background-color .25s}
.chip.ok{background:var(--c);color:var(--surface)}
.chev{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;transition:transform .3s var(--ease)}
.day.open .chev{transform:rotate(180deg)}
.day-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.day.open .day-body{grid-template-rows:1fr}
.day-body>div{overflow:hidden;min-height:0}
.day-in{padding:0 10px 4px}

/* Guia */
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 14px}
summary{font-family:var(--cond);font-weight:700;font-size:1.3rem;padding:14px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;transition:transform .3s var(--ease)}
details[open] summary svg{transform:rotate(180deg)}
details>div{padding-bottom:14px}
details[open]>div{animation:fade .3s var(--ease)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl td,.tbl th{border-top:1px solid var(--line);padding:7px 6px 7px 0;text-align:left;vertical-align:top}
.tbl th{font-family:var(--cond);font-size:1rem}
.mood{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.mood .face{flex:none;width:34px;height:34px}

/* Definições */
.set{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.set label{display:block;font-weight:600;margin-bottom:6px}
.set label+.pills{margin-bottom:14px}
.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pill{border:2px solid var(--line);background:transparent;border-radius:8px;min-height:44px;font-family:var(--cond);font-weight:700;font-size:1.05rem;transition:background-color .2s var(--ease),border-color .2s,color .2s,transform .12s}
.pill:active{transform:scale(.93)}
.pill[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--surface)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;font-size:.8rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 label{font-size:.85rem}
.warn{border-left:4px solid var(--a);padding:7px 10px;margin:6px 0;background:var(--bg);border-radius:0 6px 6px 0;font-size:.92rem;animation:fade .3s var(--ease)}
.warn.hard{border-left-color:var(--r)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 14px;font-weight:600;min-height:44px;margin:8px 8px 0 0}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{border-color:var(--r);background:transparent;color:var(--r)}
.hint{font-size:.88rem;color:var(--muted);margin-top:6px}

/* Barra de baixo */
nav.tabs{flex:none;position:relative;background:var(--nav);display:flex;justify-content:center;z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:620px;position:relative}
nav.tabs .ind{position:absolute;top:0;left:0;width:25%;height:3px;background:var(--bib);border-radius:0 0 3px 3px;transition:transform .4s var(--ease)}
nav.tabs button{flex:1;background:none;border:0;color:var(--navink);padding:10px 4px 12px;font-family:var(--cond);font-weight:600;font-size:1.05rem;min-height:56px;transition:color .25s}
nav.tabs button[aria-current="page"]{color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Secções"><div class="in"><span class="ind" aria-hidden="true"></span>
  <button data-tab="hoje">Hoje</button>
  <button data-tab="semanas">Semanas</button>

  <button data-tab="def">Definições</button>
</div></nav>
<script>
const DAYS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const DS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const MON=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const START=[2026,9,12];   // segunda, 12 out 2026
const RACE_G=68;           // sábado, 19 dez 2026
const REDUCE=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Bonecos dos exercícios ---------- */
const rad=d=>d*Math.PI/180;
const mv=(o,l,a)=>[o[0]+l*Math.sin(rad(a)),o[1]+l*Math.cos(rad(a))];
function solve(p){
  const J={P:[0,0]};
  J.N=mv(J.P,24,180-p.t);J.H=mv(J.N,10,180-(p.th??p.t));
  p.legs.forEach((l,i)=>{J["K"+i]=mv(J.P,18,l[0]);J["A"+i]=mv(J["K"+i],18,l[1]);J["T"+i]=mv(J["A"+i],8,l[2])});
  p.arms.forEach((r,i)=>{J["E"+i]=mv(J.N,12,r[0]);J["W"+i]=mv(J["E"+i],12,r[1])});
  const o=J[p.at[0]],dx=p.at[1]-o[0],dy=p.at[2]-o[1];
  for(const k in J)J[k]=[+(J[k][0]+dx).toFixed(1),+(J[k][1]+dy).toFixed(1)];
  return J;
}
const FL=y=>`<line class="fl" x1="6" y1="${y}" x2="134" y2="${y}"/>`;
const FIG={
  A1:{pb:[56,14,100,94],props:FL(92),
      p:[{t:12,legs:[[45,-12,90],[49,-12,90]],arms:[[60,80],[66,86]],at:["T0",82,92]},
         {t:12,legs:[[45,-12,45],[49,-12,45]],arms:[[60,80],[66,86]],at:["T0",82,92]}]},
  A2:{pb:[50,4,100,94],props:FL(92),
      p:[{t:0,legs:[[0,0,90],[4,-4,90]],arms:[[15,30],[22,36]],at:["T0",82,92]},
         {t:0,legs:[[0,0,40],[4,-4,40]],arms:[[15,30],[22,36]],at:["T0",82,92]}]},
  B1:{pb:[22,20,100,94],props:FL(92)+`<rect class="pr" x="24" y="77" width="30" height="5" rx="1.5"/><line class="fl" x1="28" y1="82" x2="28" y2="92"/><line class="fl" x1="50" y1="82" x2="50" y2="92"/>`,db:[0,1],
      p:[{t:10,legs:[[85,0,90],[-30,-130,-90]],arms:[[-3,0],[-3,0]],at:["T0",96,92]},
         {t:5,legs:[[29,29,90],[-20,-92,-90]],arms:[[-3,0],[-3,0]],at:["T0",96,92]}]},
  B2:{pb:[20,15,100,94],props:FL(92),db:[1],
      p:[{t:85,legs:[[12,-3,90],[-95,-95,-5]],arms:[[0,0],[0,0]],at:["T0",72,92]},
         {t:0,legs:[[0,0,90],[-10,-40,50]],arms:[[0,0],[0,0]],at:["T0",72,92]}]},
  C1:{pb:[60,0,108,94],props:FL(92)+`<rect class="pr" x="76" y="74" width="46" height="18" rx="1.5"/>`,
      p:[{t:25,legs:[[90,-20,90],[-15,-8,100]],arms:[[-25,-10],[25,60]],at:["T0",88,74]},
         {t:0,legs:[[0,0,90],[75,5,100]],arms:[[30,70],[-20,-10]],at:["T0",88,74]}]},
  C2:{pb:[48,62,112,94],props:FL(92),
      p:[{t:-90,th:-90,legs:[[140,-15,90],[146,-15,90]],arms:[[90,90],[90,90]],at:["A0",100,90]},
         {t:-109,th:-100,legs:[[110,-10,90],[114,-10,90]],arms:[[90,90],[90,90]],at:["A0",100,90]}]},
  D1:{pb:[40,40,124,94],props:FL(90),dur:9,kt:"0;0.14;0.9;1",
      p:[{t:-65.4,legs:[[90,90,170],[90,90,170]],arms:[[0,90],[180,180]],at:["A0",118,88]},
         {t:-78,legs:[[78,78,170],[78,78,170]],arms:[[0,90],[180,180]],at:["A0",118,88]}]},
  D2:{pb:[22,46,124,94],props:FL(92),dur:5,kt:"0;0.4;0.6;1",
      p:[{t:-90,th:-90,legs:[[180,90,180],[172,82,172]],arms:[[180,180],[168,168]],at:["P",76,86]},
         {t:-90,th:-90,legs:[[100,100,100],[172,82,172]],arms:[[180,180],[-95,-95]],at:["P",76,86]}]}
};
const SPL="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1";
function fig(id,label){
  const F=FIG[id],A=solve(F.p[0]),B=solve(F.p[1]),kt=F.kt||"0;0.33;0.5;1",dur=F.dur||6;
  const an=(at,a,b)=>REDUCE?"":`<animate attributeName="${at}" values="${a};${b};${b};${a}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${SPL}"/>`;
  const pts=(J,ks)=>ks.map(k=>J[k].join(",")).join(" ");
  const pl=(ks,cls)=>{const a=pts(A,ks),b=pts(B,ks);return `<polyline class="lb ${cls}" points="${REDUCE?b:a}">${an("points",a,b)}</polyline>`};
  const ci=(k,cls,r)=>{const a=A[k],b=B[k],s=REDUCE?b:a;return `<circle class="${cls}" cx="${s[0]}" cy="${s[1]}" r="${r}">${an("cx",a[0],b[0])}${an("cy",a[1],b[1])}</circle>`};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  [A,B].forEach(J=>{for(const k in J){x0=Math.min(x0,J[k][0]-7);y0=Math.min(y0,J[k][1]-7);x1=Math.max(x1,J[k][0]+7);y1=Math.max(y1,J[k][1]+7)}});
  if(F.pb){x0=Math.min(x0,F.pb[0]);y0=Math.min(y0,F.pb[1]);x1=Math.max(x1,F.pb[2]);y1=Math.max(y1,F.pb[3])}
  x0-=4;x1+=4;y0-=4;y1+=2;let w=x1-x0,hh=y1-y0;const R=1.35;
  if(w/hh<R){const nw=hh*R;x0-=(nw-w)/2;w=nw}else{const nh=w/R;y0-=nh-hh;hh=nh}
  let s=`<svg class="fig" viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${hh.toFixed(1)}" role="img" aria-label="${label||""}">${F.props}`;
  s+=pl(["N","E1","W1"],"far")+pl(["P","K1","A1","T1"],"far");
  s+=pl(["P","N"],"")+pl(["P","K0","A0","T0"],"")+pl(["N","E0","W0"],"");
  (F.db||[]).forEach(i=>s+=ci("W"+i,"db",4.2));
  s+=ci("H","hd",6.5)+"</svg>";
  return s;
}
const figs=(id,n)=>`<div class="figw">${fig(id,n)}</div>`;

/* ---------- Plano ---------- */
const WEEKS=[
 {r:[5,5],L:{km:12},focus:"Semana de adaptação. Força fase 1 e só percursos planos.",ph:1},
 {r:[5,6],L:{km:16},focus:"Primeiro teste de abastecimento, um gel ou gomas aos 45 min.",ph:1},
 {r:[6,6],L:{km:19},focus:"O longo mais comprido até agora. Anda sempre que precisares.",ph:1},
 {r:[5,5],L:{km:14,rp:"Os últimos 4 km"},focus:"Semana leve para o corpo assimilar. Começa a fase 2 da força.",ph:2,easy:true},
 {r:[6,7],L:{km:22},focus:"A partir daqui comes como na prova. Testa o corre e anda no longo.",ph:2},
 {r:[6,8],L:{km:25,rp:"Do km 15 ao 22"},focus:"Ritmo de prova com as pernas já cansadas.",ph:2},
 {r:[6,8],L:{km:28,peak:true},focus:"Ensaio geral. Roupa, sapatilhas, pequeno-almoço, géis e hora de partida iguais aos da prova.",ph:2},
 {r:[6,6],L:{km:20,rp:"Do km 8 ao 16"},focus:"A carga começa a descer. Força fase 3, só para manter.",ph:3},
 {r:[5,5],L:{km:13,rp:"Os últimos 5 km"},focus:"Última sessão de força até quarta, 9 de dezembro.",ph:3},
 {race:true,focus:"Sem força. Dorme bem, carrega nos hidratos quinta e sexta e descansa."}
];
const STR=[
 {id:"A1",n:"Gémeos com joelho fletido",en:"Bent-knee calf raise",p1:"3×15 com as duas pernas, sem peso",p2:"3×12 só com uma perna, com haltere ou mochila",k:"Joelhos dobrados uns 30 a 40 graus durante todo o movimento. Sobe nas pontas, segura 1 s e desce devagar. Se precisares, apoia as mãos numa parede."},
 {id:"A2",n:"Gémeos com joelho esticado",en:"Straight-knee calf raise",p1:"3×12 com as duas pernas, no chão",p2:"3×12 só com uma perna, calcanhar fora do degrau",k:"Pernas esticadas, sobe o mais alto que conseguires e desce devagar. Só passa para o degrau quando no chão já for fácil."},
 {id:"B1",n:"Afundo búlgaro",en:"Bulgarian split squat",p1:"3×8 por perna, afundo normal sem peso",p2:"3×8 por perna, pé de trás no banco e com peso",k:"O joelho da frente acompanha os dedos do pé. Desce devagar."},
 {id:"B2",n:"Peso morto romeno a uma perna",en:"Single-leg Romanian deadlift",p1:"3×8 por perna, com a mão na parede",p2:"3×8 por perna, haltere na mão do lado contrário",k:"Leva a anca para trás com as costas direitas. Deves sentir atrás da coxa e nos glúteos."},
 {id:"C1",n:"Subida ao banco",en:"Step-up",p1:"3×10 por perna",p2:"3×10 por perna, com pesos",k:"Empurra com o pé que está em cima. A perna de baixo não ajuda."},
 {id:"C2",n:"Ponte de glúteos",en:"Glute bridge",p1:"3×12 com as duas pernas",p2:"3×10 só com uma perna",k:"Aperta os glúteos lá em cima e segura 2 s."},
 {id:"D1",n:"Prancha lateral",en:"Side plank",p1:"2×30 s de cada lado",p2:"2×40 s de cada lado",k:"Deitado de lado, cotovelo por baixo do ombro e o outro braço para o teto. Levanta a anca até o corpo ficar direito e aguenta o tempo todo nessa posição, sem a deixar descer. Não é para subir e descer."},
 {id:"D2",n:"Inseto morto",en:"Dead bug",p1:"2×10 de cada lado",p2:"2×12 de cada lado",k:"De costas, braços para o teto e joelhos a 90 graus. Estica devagar um braço e a perna do lado contrário, sem tirar a lombar do chão, e volta."}
];

/* ---------- Estado ---------- */
const SK="maratona19dez:v1";
function defaults(){return{cfg:{name:"",climb:[0,4],gym:[2],runs:[1,3],long:5,strength:0,easy:"7:00 a 7:30",longp:"7:45 a 8:15",race:"7:40 a 7:45"},log:{}};}
function fixPace(v){return String(v).replace(/\s*[–—-]\s*/g," a ")}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(SK)||"null")}catch(e){}const b=defaults();if(!d)return b;
  const c=Object.assign(b.cfg,d.cfg||{});["easy","longp","race"].forEach(k=>c[k]=fixPace(c[k]));return{cfg:c,log:d.log||{}};}
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
let S=load();
const TABS=["hoje","semanas","guia","def"];
let UI={tab:"hoje",week:null,first:true};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dateOf(g){return new Date(START[0],START[1],START[2]+g)}
function keyOf(g){const d=dateOf(g);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(g){const d=dateOf(g);return d.getDate()+" "+MON[d.getMonth()]}
function todayG(){const t=new Date();const a=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-dateOf(0))/864e5)}
const curWeek=()=>Math.min(9,Math.max(0,Math.floor(todayG()/7)));

/* ---------- Sessões de cada dia ---------- */
function sessions(g){
  if(g<0||g>RACE_G)return[];
  const w=Math.floor(g/7),d=g%7,W=WEEKS[w],c=S.cfg,out=[];
  const runs=[...c.runs].sort((a,b)=>a-b);
  const eveOfLong=((d+1)%7)===c.long;
  const calf="No fim, 5 min de gémeos. 2×15 com o joelho fletido e 2×15 com o joelho esticado.";
  if(c.climb.includes(d)){
    const l=[];
    if(W.race&&g===RACE_G-1)l.push("Véspera da prova. Salta ou faz uma coisa muito leve.");
    else if(W.race)l.push("Semana da prova, sessão leve.");
    else if(eveOfLong)l.push("Amanhã há longo, mantém a sessão leve.");
    out.push({id:"climb",t:"climb",title:"Escalada",lines:l});
  }
  if(W.race){
    if(runs[0]===d&&g<RACE_G-1)out.push({id:"run1",t:"run",km:5,title:"Corrida de 5 km",lines:[`Fácil, a ${c.easy} por km, com 2 km a ritmo de prova.`,calf]});
    const sh=(runs[1]===3||runs[1]===4)?runs[1]:3;
    if(d===sh)out.push({id:"run2",t:"run",km:3,title:"3 km para soltar",lines:["Muito fácil, só para as pernas não ficarem presas.","Hoje e amanhã carrega nos hidratos."]});
    if(g===RACE_G)out.push({id:"race",t:"race",km:42.2,title:"Maratona, 42,2 km",lines:[
      "Pequeno-almoço 2 a 4 horas antes, igual ao dos longos das semanas 6 e 7.",
      `Até ao km 10 vai uns 5 a 10 s por km mais lento do que os ${c.race}. Vai parecer fácil demais e é suposto.`,
      "Do km 10 ao 30, ritmo alvo. Come a cada 30 ou 40 min, com ou sem fome.",
      "Do 30 ao fim, segura o ritmo.",
      "Anda nos abastecimentos e bebe quando tiveres sede. Nada de novo hoje."]});
    if(c.gym.includes(d)&&d<=3)out.push({id:"gym",t:"gym",title:"Ginásio",lines:["Semana da prova. Leve e sem pernas, ou salta."]});
  }else{
    const ri=runs.indexOf(d);
    if(ri>=0&&d!==c.long){const km=W.r[ri];const l=[`Ritmo de ${c.easy} por km, a conseguir falar.`,calf];if(w<2)l.splice(1,0,"Percurso plano.");
      out.push({id:"run"+(ri+1),t:"run",km,title:`Corrida fácil de ${km} km`,lines:l});}
    if(d===c.long){const L=W.L,l=[`Ritmo de ${c.longp} por km. Mais lento do que o da prova, de propósito.`];
      if(L.rp)l.push(`${L.rp} a ritmo de prova, ${c.race} por km.`);
      if(w===1)l.push("Aos 45 min experimenta um gel ou umas gomas.");
      if(w===2||w===3)l.push("Treina o abastecimento, um gel a cada 30 ou 40 min depois dos 45 min.");
      if(w>=4)l.push("Come como na prova, 30 a 60 g de hidratos por hora a partir dos 30 ou 45 min.");
      if(w===4)l.push("Experimenta correr 9 min e andar 1 min. Se souber bem, fazes assim na prova.");
      if(w===6)l.push("Tudo igual ao dia da prova, da roupa ao pequeno-almoço.");
      if(w===2)l.push("Anda sempre que precisares.");
      l.push("Depois, uma refeição com hidratos e proteína nas 2 horas seguintes.");
      out.push({id:"long",t:"long",km:L.km,title:L.peak?`Longo de ${L.km} km, o pico`:`Longo de ${L.km} km`,lines:l});}
    if(c.gym.includes(d)){const l=[];if(eveOfLong)l.push("Amanhã há longo, deixa as pernas em paz.");out.push({id:"gym",t:"gym",title:"Ginásio",lines:l});}
    if(c.strength===d&&W.ph){
      const l=["Aquece 5 min. Andar ou bicicleta, balanços de perna, círculos com os tornozelos, 10 agachamentos e 10 pontes.",
               "Faz cada par seguido, A1 com A2, B1 com B2, C1 com C2 e D1 com D2, e descansa 45 a 60 s entre voltas. Sobe em 2 s e desce em 3 s."];
      if(w===8&&c.strength>2)l.unshift("<b>Esta semana faz o reforço até quarta, 9 de dezembro.</b>");
      if(W.ph===2)l.push("Quando a última repetição de todas as séries for fácil, sobe 2 a 5 kg na semana seguinte.");
      if(W.ph===3)l.push("Só 2 séries e uns 20% menos de peso. É para manter, não para cansar.");
      out.push({id:"str",t:"str",title:`Reforço de pernas, fase ${W.ph}`,lines:l,ph:W.ph});}
  }
  if(!out.length){if(g===RACE_G+1)return[];const prevLong=((d+6)%7)===c.long&&g>0;
    out.push({id:"rest",t:"rest",rest:true,title:prevLong?"Recuperação":"Descanso",lines:prevLong?["Descansa ou dá uma caminhada de 20 a 30 min."]:[]});}
  return out;
}
function weekKm(w){let k=0;for(let d=0;d<7;d++)sessions(w*7+d).forEach(s=>{if(s.km)k+=s.km});return String(Math.round(k*10)/10).replace(".",",")}
const lk=(g,s)=>keyOf(g)+"|"+s.id;
function totals(){let plan=0,toDate=0,done=0,sesDone=0,sesToDate=0;const t=todayG();
  for(let g=0;g<=RACE_G;g++)sessions(g).forEach(s=>{if(s.rest)return;const L=S.log[lk(g,s)]||{};
    if(s.km)plan+=s.km;if(g<=t){if(s.km)toDate+=s.km;sesToDate++}if(L.done){if(s.km)done+=s.km;sesDone++}});
  const r=v=>String(Math.round(v*10)/10).replace(".",",");
  return{plan:Math.round(plan),toDate:r(toDate),done:r(done),pct:toDate?Math.min(100,Math.round(done/toDate*100)):0,sesDone,sesToDate};}

/* ---------- Smiles ---------- */
function face(v){
  const eyes=v==="r"?`<path d="M6.8 8.2l2.6 1.5-2.6 1.5M17.2 8.2l-2.6 1.5 2.6 1.5"/>`:`<circle class="eye" cx="8.6" cy="9.6" r="1.35"/><circle class="eye" cx="15.4" cy="9.6" r="1.35"/>`;
  const m={g:"M7.6 14.2c1.2 2 2.6 2.9 4.4 2.9s3.2-.9 4.4-2.9",a:"M8.2 15.6c1.3-.5 2.6-.4 3.8 0s2.5.5 3.8 0",r:"M8 17.2c1.1-1.6 2.5-2.4 4-2.4s2.9.8 4 2.4"}[v];
  return `<svg class="face" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/>${eyes}<path d="${m}"/></svg>`;
}
const MOOD={g:"Bem",a:"Mais ou menos",r:"Dói"};
const ADV={g:"Segue o plano.",
 a:"Dor de 3 ou 4 em 10, ou pernas presas que passam num dia. Não aumentes. Repete a distância do longo desta semana e faz pausas a andar.",
 r:"Dor acima de 4 em 10, a piorar ou a coxear. Para de correr, fica 2 ou 3 dias sem correr e vai a um fisioterapeuta. Depois retoma na última semana que correu bem."};

/* ---------- Componentes ---------- */
const CHK=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.6 12.4l3 3 5.8-6.2"/></svg>`;
const CHEV=`<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
function exList(ph){
  return `<div class="exs">${STR.map(e=>{let p=ph===1?e.p1:e.p2;if(ph===3)p=p.replace(/^3×/,"2×");
    return `<div class="exr">${figs(e.id,e.n)}<div><b>${e.id}. ${e.n}</b><em>${e.en}</em><span>${p}</span><small>${e.k}</small></div></div>`}).join("")}</div>`;
}
function card(g,s){
  const k=lk(g,s),L=S.log[k]||{};
  const isRun=["run","long","race"].includes(s.t);
  return `<article class="ses t-${s.t}${L.done?" done":""}" data-card="${k}">
  <div class="ses-h"><h3>${s.title}</h3>${s.rest?"":`<button class="chk" data-act="done" data-k="${k}" aria-pressed="${!!L.done}">${CHK}<span>${L.done?"Feito":"Marcar"}</span></button>`}</div>
  ${s.lines.length?`<ul>${s.lines.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}
  ${s.ph?exList(s.ph):""}
  ${isRun?`<div class="feel"><div class="feel-q">Como ficaram as pernas?</div><div class="faces">${["g","a","r"].map(v=>`<button class="fb" data-act="feel" data-k="${k}" data-v="${v}" aria-pressed="${L.feel===v}">${face(v)}<span>${MOOD[v]}</span></button>`).join("")}</div><div class="advice" data-adv="${k}">${L.feel?ADV[L.feel]:""}</div></div>`:""}
  </article>`;
}
function progHTML(){const T=totals();
  return `<div class="stats">
    <div><b>${T.done} km</b><span class="small muted">feitos</span></div>
    <div><b>${T.toDate} km</b><span class="small muted">até hoje</span></div>
    <div><b>${T.plan} km</b><span class="small muted">no plano todo</span></div></div>
    <div class="bar" role="img" aria-label="${T.pct}% dos km previstos até hoje"><i data-w="${T.pct}"></i></div>
    <div class="small muted">${T.sesDone} de ${T.sesToDate} sessões feitas até hoje.</div>`;}

/* ---------- Ecrãs ---------- */
function vHoje(){
  const t=todayG(),c=S.cfg,left=RACE_G-t,w=Math.floor(t/7);
  let h=`<section class="bib" aria-label="Dias até à prova"><i class="pin tl"></i><i class="pin tr"></i><i class="pin bl"></i><i class="pin br"></i>
    <div class="bib-band">Maratona, 19 de dezembro</div>
    <div class="bib-num" id="bibn" data-n="${left>0?left:0}">${left>0?left:left===0?"0":"✓"}</div>
    <div class="bib-cap">${left>1?"dias para a prova":left===1?"dia para a prova":left===0?"É hoje":"Prova feita"}</div>
    <div class="bib-foot">${c.name?esc(c.name)+", ":""}${t<0?"o plano começa a 12 de outubro":t>RACE_G?"parabéns":`semana ${w+1} de 10`}</div></section>`;
  if(t>=0&&t<=RACE_G){
    h+=`<h2>Hoje, ${DAYS[t%7].toLowerCase()} ${fmt(t)}</h2>`+sessions(t).map(s=>card(t,s)).join("");
    if(t+1<=RACE_G)h+=`<h2>Amanhã</h2><div class="chips">${sessions(t+1).map(s=>`<span class="chip t-${s.t}">${s.title}</span>`).join("")}</div>`;
  }else if(t<0)h+=`<h2>Primeiro dia</h2>`+sessions(0).map(s=>card(0,s)).join("");
  h+=`<h2>Progresso</h2><section class="prog" id="prog">${progHTML()}</section>`;
  return h;
}
function vSemanas(){
  if(UI.week===null)UI.week=curWeek();
  const cw=curWeek(),t=todayG();
  return `<h2 style="margin-top:6px">Semanas</h2><div class="wk-strip" id="strip">${WEEKS.map((_,i)=>`<button class="wk${i===cw&&t>=0&&t<=RACE_G?" now":""}" data-act="week" data-w="${i}" aria-current="${i===UI.week}">S${i+1}</button>`).join("")}</div><div id="wkb">${weekBody()}</div>`;
}
function weekBody(){
  const w=UI.week,W=WEEKS[w],t=todayG(),g0=w*7,g1=Math.min(g0+6,RACE_G);
  let h=`<div class="wk-body"><section class="wk-head"><div class="km">${weekKm(w)} km</div>
    <h3>Semana ${w+1}, de ${fmt(g0)} a ${fmt(g1)}${W.easy?'<span class="tag">semana leve</span>':""}${W.race?'<span class="tag">prova</span>':""}${W.L&&W.L.peak?'<span class="tag">pico</span>':""}</h3>
    <p class="muted small" style="margin:6px 0 0">${W.focus}</p></section>`;
  for(let d=0;d<7;d++){const g=g0+d;if(g>RACE_G)break;const ss=sessions(g),open=g===t;
    h+=`<div class="day${g===t?" today":""}${open?" open":""}">
      <button class="day-row" data-act="open" aria-expanded="${open}">
        <div class="dl"><b>${DS[d]}</b><span>${fmt(g)}</span></div>
        <div class="chips">${ss.map(s=>{const k=lk(g,s),L=S.log[k]||{};return `<span class="chip t-${s.t}${L.done?" ok":""}" data-chip="${k}">${s.title.replace(/^Reforço de pernas.*/,"Reforço").replace("Corrida fácil de ","Corrida ").replace("Longo de ","Longo ").replace(", o pico","")}</span>`}).join("")}</div>${CHEV}</button>
      <div class="day-body"><div><div class="day-in">${ss.map(s=>card(g,s)).join("")}</div></div></div></div>`;}
  return h+"</div>";
}
function vGuia(){
  const c=S.cfg,sum=t=>`<summary>${t}${CHEV.replace('class="chev" ','')}</summary>`;
  return `<h2 style="margin-top:6px">Guia</h2>
  <details open>${sum("Ritmos")}<div><table class="tbl">
   <tr><th>Tipo</th><th>Por km</th><th>Como deve saber</th></tr>
   <tr><td>Corridas da semana</td><td>${esc(c.easy)}</td><td>Consegues falar em frases inteiras.</td></tr>
   <tr><td>Longos</td><td>${esc(c.longp)}</td><td>Mais lento do que o da prova, de propósito. O que conta é a distância.</td></tr>
   <tr><td>Ritmo de prova</td><td>${esc(c.race)}</td><td>Treinado dentro dos longos a partir da semana 4.</td></tr>
  </table><p class="hint">Neste bloco não há séries nem treinos rápidos. Os ritmos mudam-se em Definições.</p></div></details>
  <details>${sum("Reforço de pernas")}<div>
   <p>Uma vez por semana, 30 min, pelo menos 48 horas antes do longo. Devagar e controlado, 2 s a subir e 3 s a descer.</p>
   <p class="small muted">Aquecimento de 5 min. Andar ou bicicleta, 10 balanços de perna para a frente e 10 para o lado, 10 círculos com cada tornozelo, 10 agachamentos e 10 pontes.</p>
   <div class="exs">${STR.map(e=>`<div class="exr">${figs(e.id,e.n)}<div><b>${e.id}. ${e.n}</b><em>${e.en}</em><span><b style="display:inline;font-size:.95rem">Fase 1</b> ${e.p1}</span><span><b style="display:inline;font-size:.95rem">Fase 2</b> ${e.p2}</span><small>${e.k}</small></div></div>`).join("")}</div>
   <p class="hint">A fase 1 vai da semana 1 à 3 e a fase 2 da 4 à 7. Na fase 3, semanas 8 e 9, fazes os exercícios da fase 2 com só 2 séries e uns 20% menos de peso. Na semana da prova não há reforço.</p></div></details>
  <details>${sum("Gémeos depois de correr")}<div>
   <p>Depois de cada corrida da semana, 2×15 com o joelho fletido e 2×15 com o joelho esticado, com as duas pernas e devagar. Leva 5 min.</p>
   <div class="exs"><div class="exr">${figs("A1","Gémeos com joelho fletido")}<div><b>Joelho fletido</b><em>Bent-knee calf raise</em><small>Joelhos dobrados durante todo o movimento.</small></div></div>
   <div class="exr">${figs("A2","Gémeos com joelho esticado")}<div><b>Joelho esticado</b><em>Straight-knee calf raise</em><small>Pernas esticadas, no chão.</small></div></div></div>
   <p class="hint">Alongar e usar o rolo é opcional. Não substitui o reforço.</p></div></details>
  <details>${sum("Como te sentes")}<div>
   <p class="small">Depois de cada corrida e de manhã, escolhe uma cara.</p>
   ${["g","a","r"].map(v=>`<div class="mood" style="color:var(--${v})">${face(v)}<div style="color:var(--ink)"><b>${MOOD[v]}.</b> ${v==="g"?"Dor de 0 a 2 em 10 que passa até à manhã seguinte. "+ADV.g:ADV[v]}</div></div>`).join("")}
   <p class="hint">Vai logo ao médico se a barriga da perna inchar, ficar quente ou vermelha, doer em repouso, ou se a dor começou com um estalo.</p></div></details>
  <details>${sum("Organizar a semana")}<div>
   <p>Deixa um dia de folga entre corridas sempre que der. Na véspera do longo, só coisas leves ou descanso. O reforço fica pelo menos 48 horas antes do longo e o dia a seguir ao longo é para descansar ou caminhar.</p>
   <p>Se tiveres de cortar alguma coisa, corta primeiro uma corrida da semana e depois o reforço. O longo é para manter.</p>
   <p class="small muted">Se falhares uns dias, continua sem tentar compensar os km. Se falhares uma semana, repete a última que fizeste e, se precisares, salta a semana leve. Se falhares duas ou mais, o longo maior fica nos 24 ou 25 km e na prova fazes corre e anda.</p></div></details>
  <details>${sum("Corre e anda, e a prova")}<div>
   <p>Corres 9 min e andas 1 min a passo rápido. Para manter a média, os bocados a correr ficam uns 20 a 25 s por km mais rápidos. Testa no longo da semana 5 e, se gostares, usa nas semanas 6 e 7 e na prova. No dia, fazes como treinaste.</p>
   <p>Na prova, os primeiros 10 km vão mais lentos do que o ritmo alvo. Do 10 ao 30 vais no ritmo e comes a cada 30 ou 40 min. Do 30 ao fim, aguentas. Em dezembro, parte com uma camisola velha ou um saco do lixo que possas deitar fora e umas luvas finas.</p></div></details>
  <details>${sum("Comer e beber")}<div>
   <p><b>No dia a dia</b> não tentes perder peso neste bloco. Hidratos de 3 a 5 g por kg nos dias normais e 5 a 7 g por kg na véspera e no dia dos longos. Proteína de 1,4 a 1,6 g por kg por dia, dividida por 3 ou 4 refeições. Dorme 7 a 9 horas.</p>
   <p><b>Nos longos e na prova</b> come 30 a 60 g de hidratos por hora a partir dos 30 ou 45 min. Um gel tem 20 a 25 g. Treina o estômago em todos os treinos acima de hora e meia e usa o mesmo produto que vais usar na prova.</p>
   <p><b>A beber</b>, bebe quando tens sede, uns 400 a 800 ml por hora e menos com frio. Beber demais é perigoso. Pesa-te antes e depois de um longo. Se aumentaste, bebeste demais.</p>
   <p><b>Nos últimos dias</b> carrega nos hidratos quinta e sexta, 8 a 10 g por kg por dia, com pouca fibra e pouca gordura. O pequeno-almoço é 2 a 4 horas antes da partida, 1 a 3 g de hidratos por kg, e já testado nas semanas 6 e 7. Nada de novo no dia.</p></div></details>
  <p class="hint">Isto é orientação geral e não substitui um médico ou fisioterapeuta.</p>`;
}
function warnings(c){
  const w=[],L=c.long,r=c.runs,before=(L+6)%7,after=(L+1)%7;
  if(r.length!==2)w.push(["hard","Escolhe exatamente 2 dias para as corridas da semana."]);
  if(r.includes(L))w.push(["hard","O longo não pode calhar no mesmo dia de uma corrida da semana."]);
  if(r.length===2&&[1,6].includes(Math.abs(r[0]-r[1])))w.push(["hard","As duas corridas estão em dias seguidos. Deixa um dia de folga entre elas."]);
  if(r.includes(before))w.push(["hard",`Tens uma corrida na véspera do longo, à ${DAYS[before].toLowerCase()}. Esse dia devia ser leve ou de descanso.`]);
  if(r.includes(after))w.push(["hard","Tens uma corrida no dia a seguir ao longo. Esse dia é para descansar ou caminhar."]);
  if(((L-c.strength+7)%7)<2)w.push(["hard","O reforço tem de ficar pelo menos 48 horas antes do longo."]);
  if(c.climb.includes(before))w.push(["soft","A escalada calha na véspera do longo, por isso mantém-na leve."]);
  if(c.gym.includes(before))w.push(["soft","O ginásio calha na véspera do longo, por isso evita pernas."]);
  if(L!==5)w.push(["soft","A prova é a um sábado. A partir da semana 6 o ideal é o longo ser ao sábado."]);
  return w;
}
function warnHTML(){const W=warnings(S.cfg);return W.length?W.map(([l,m])=>`<div class="warn ${l}">${m}</div>`).join(""):`<p class="hint">A semana está bem montada.</p>`}
function pills(field,multi,col){
  const v=S.cfg[field];
  return `<div class="pills" role="group">${DS.map((n,i)=>`<button class="pill" style="--c:var(${col})" data-act="pill" data-f="${field}" data-m="${multi}" data-d="${i}" aria-pressed="${multi?v.includes(i):v===i}">${n}</button>`).join("")}</div>`;
}
function vDef(){
  const c=S.cfg;
  return `<h2 style="margin-top:6px">Definições</h2>
  <div class="set"><label for="nm">Nome</label><input id="nm" type="text" data-act="name" value="${esc(c.name)}" placeholder="Opcional" autocomplete="off"></div>
  <div class="set">
   <label>Corridas da semana, 2 dias</label>${pills("runs",1,"--run")}
   <label>Longo</label>${pills("long",0,"--long")}
   <label>Reforço de pernas</label>${pills("strength",0,"--str")}
   <label>Escalada</label>${pills("climb",1,"--climb")}
   <label>Ginásio</label>${pills("gym",1,"--gym")}
   <div id="warns">${warnHTML()}</div>
   <p class="hint">A prova fica sempre no sábado, 19 de dezembro. Na semana da prova as corridas acertam-se sozinhas.</p></div>
  <div class="set"><label>Ritmos por km</label><div class="row3">
   <div><label for="pe">Fácil</label><input id="pe" type="text" data-act="pace" data-f="easy" value="${esc(c.easy)}"></div>
   <div><label for="pl">Longo</label><input id="pl" type="text" data-act="pace" data-f="longp" value="${esc(c.longp)}"></div>
   <div><label for="pr">Prova</label><input id="pr" type="text" data-act="pace" data-f="race" value="${esc(c.race)}"></div></div>
   <p class="hint">Estes valores vêm do plano original, ajusta-os ao teu nível. O longo deve ser 10 a 30 s por km mais lento do que o da prova e o fácil tem de ser confortável.</p></div>
  <div class="set"><label>Cópia de segurança</label>
   <p class="hint" style="margin-top:0">O progresso fica guardado neste telemóvel e neste navegador. Copia o texto para o guardar ou levar para outro lado.</p>
   <textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea>
   <button class="btn ghost" data-act="copy">Copiar dados</button>
   <label for="imp" style="margin-top:14px">Importar dados</label>
   <textarea id="imp" placeholder="Cola aqui o texto que copiaste"></textarea>
   <button class="btn" data-act="import">Importar</button>
   <div id="msg" class="hint" role="status"></div></div>
  <div class="set"><label>Recomeçar</label><button class="btn danger" data-act="reset">Apagar progresso</button>
   <p class="hint">Apaga as sessões marcadas. Os dias que escolheste ficam.</p></div>`;
}

/* ---------- Render ---------- */
const app=document.getElementById("app");
function fillBars(){setTimeout(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%"),40)}
function render(dir){
  app.innerHTML=`<div class="view" style="--dir:${dir||0}">${{hoje:vHoje,semanas:vSemanas,guia:vGuia,def:vDef}[UI.tab]()}</div>`;
  const idx=TABS.indexOf(UI.tab);
  document.querySelector("nav.tabs .ind").style.transform=`translateX(${idx*100}%)`;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===UI.tab?"page":"false"));
  fillBars();
  if(UI.tab==="semanas"){const s=document.getElementById("strip"),b=s&&s.querySelector('[aria-current="true"]');if(b)s.scrollLeft=b.offsetLeft-s.clientWidth/2+b.clientWidth/2;}
  if(UI.tab==="hoje"&&UI.first&&!REDUCE){UI.first=false;countUp();}
}
function countUp(){const el=document.getElementById("bibn");if(!el)return;const n=+el.dataset.n;if(!n)return;
  const t0=performance.now(),D=900;el.textContent="0";
  const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=Math.round(n*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);}
function setLog(k,f){S.log[k]=S.log[k]||{};f(S.log[k]);save();}

document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.tab===UI.tab)return;
  const dir=Math.sign(TABS.indexOf(b.dataset.tab)-TABS.indexOf(UI.tab));UI.tab=b.dataset.tab;render(dir);app.scrollTop=0});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="done"){const k=b.dataset.k;setLog(k,L=>L.done=!L.done);const on=S.log[k].done;
    document.querySelectorAll(`[data-act="done"][data-k="${k}"]`).forEach(x=>{x.setAttribute("aria-pressed",on);x.querySelector("span").textContent=on?"Feito":"Marcar"});
    document.querySelectorAll(`[data-card="${k}"]`).forEach(x=>x.classList.toggle("done",on));
    document.querySelectorAll(`[data-chip="${k}"]`).forEach(x=>x.classList.toggle("ok",on));
    const p=document.getElementById("prog");if(p){const old=p.querySelector(".bar i");const w0=old?old.style.width:"0";p.innerHTML=progHTML();const ni=p.querySelector(".bar i");ni.style.width=w0;fillBars();}}
  else if(a==="feel"){const k=b.dataset.k,v=b.dataset.v;setLog(k,L=>L.feel=L.feel===v?null:v);const cur=S.log[k].feel;
    document.querySelectorAll(`[data-act="feel"][data-k="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===cur));
    document.querySelectorAll(`[data-adv="${k}"]`).forEach(x=>x.textContent=cur?ADV[cur]:"");}
  else if(a==="week"){UI.week=+b.dataset.w;document.querySelectorAll("#strip .wk").forEach(x=>x.setAttribute("aria-current",x===b));
    document.getElementById("wkb").innerHTML=weekBody();b.scrollIntoView({behavior:REDUCE?"auto":"smooth",inline:"center",block:"nearest"});}
  else if(a==="open"){const d=b.closest(".day");const o=d.classList.toggle("open");b.setAttribute("aria-expanded",o);}
  else if(a==="pill"){const f=b.dataset.f,d=+b.dataset.d,c=S.cfg;
    if(b.dataset.m==="1"){let v=c[f];if(v.includes(d))v=v.filter(x=>x!==d);else{v=[...v,d];if(f==="runs"&&v.length>2)v=v.slice(-2);}c[f]=v;}else c[f]=d;save();
    document.querySelectorAll(`.pill[data-f="${f}"]`).forEach(x=>{const i=+x.dataset.d;x.setAttribute("aria-pressed",Array.isArray(c[f])?c[f].includes(i):c[f]===i)});
    document.getElementById("warns").innerHTML=warnHTML();document.getElementById("exp").value=JSON.stringify(S);}
  else if(a==="copy"){const t=document.getElementById("exp"),m=document.getElementById("msg");t.select();
    const ok=()=>m.textContent="Dados copiados.";
    const fb=()=>{try{document.execCommand("copy");ok()}catch(err){m.textContent="Não deu para copiar. Seleciona o texto e copia à mão."}};
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(ok,fb);else fb();}
  else if(a==="import"){const m=document.getElementById("msg");try{const d=JSON.parse(document.getElementById("imp").value);if(!d.cfg)throw 0;
    const c=Object.assign(defaults().cfg,d.cfg);["easy","longp","race"].forEach(k=>c[k]=fixPace(c[k]));S={cfg:c,log:d.log||{}};save();render();
    document.getElementById("msg").textContent="Dados importados.";}catch(err){m.textContent="O texto que colaste não é uma cópia válida. Volta a copiar em Copiar dados.";}}
  else if(a==="reset"){if(confirm("Apagar todas as sessões marcadas como feitas?")){S.log={};save();render();}}
});
app.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.act==="name"){S.cfg.name=t.value;save();}
  if(t.dataset.act==="pace"){S.cfg[t.dataset.f]=t.value;save();}
});
render();
</script>
</body>
</html>
